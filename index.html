<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Final Project - Food Adventure Game</title>
    <script src="libs/p5.min.js"></script>
    <script src="libs/p5.sound.min.js"></script>
    <script src="libs/planck.min.js"></script>
    <script src="libs/p5play.js"></script>
    <script src="js/food.js"></script>
    <script src="js/sketch.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            overflow: hidden;
        }
        
        .game-wrapper {
            position: relative;
            display: inline-block;
        }
        
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 5px #ffd966, 0 0 0 10px #4a2e2e;
            cursor: pointer;
        }
        
        .controls-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        
        .music-toggle, .sound-toggle {
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 12px;
            font-family: monospace;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .music-toggle:hover, .sound-toggle:hover {
            background: rgba(0,0,0,0.9);
            transform: scale(1.05);
        }
        
        .touch-hint {
            display: none;
        }
        
        @media (max-width: 768px) {
            .touch-hint {
                display: block;
                position: fixed;
                bottom: 80px;
                left: 0;
                right: 0;
                text-align: center;
                color: rgba(255,255,255,0.6);
                font-size: 12px;
                background: rgba(0,0,0,0.5);
                padding: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div id="gameCanvas"></div>
    </div>
    <div class="controls-panel">
        <button class="music-toggle" id="musicToggle">Music: ON</button>
        <button class="sound-toggle" id="soundToggle">SFX: ON</button>
    </div>
    <div class="touch-hint">Click to focus | Use WASD or Arrow Keys to move</div>
</body>
</html>
